name: KENO v7.1 Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: update-keno-v71
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update KENO v7.1 history
        run: node keno-update-v71.js

      - name: Commit new draws
        run: |
          if git diff --quiet -- keno-history-v71.json keno-status-v71.json; then
            echo "No new draws"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history-v71.json keno-status-v71.json
          git commit -m "Update KENO v7.1 history"
          git push
