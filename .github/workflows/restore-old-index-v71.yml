name: Restore old KENO v7 index

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-old-index-v71.yml"

permissions:
  contents: write

concurrency:
  group: restore-old-index-v71
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index.html from version before wrong upload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git show ad3fb184060fa7f7df897146aa6c1d9ba2c15b9d:index.html > index.html

          grep -q 'ПОЗИТРОН КЕНО v7.1' index.html
          grep -q 'СБОРКА 7.1.3' index.html
          grep -q "7.1.3-auto-update-20260802" index.html

          echo "Old index.html restored and verified."

      - name: Commit restored index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.html; then
            echo "index.html already equals old version."
            exit 0
          fi

          git add index.html
          git commit -m "Restore KENO v7 index before wrong upload"
          git push origin HEAD:main
