name: KENO v7.1 Auto Update

# Единственный автоматический запуск приходит извне через workflow_dispatch.
# Внутренний GitHub schedule удалён, чтобы два источника не ставили запуски в очередь.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keno-v71-single
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fresh main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git reset --hard origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Stoloto OAuth · double verification
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node stoloto-keno-update-v71.mjs

      - name: Commit new draws
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- keno-history-v71.json keno-status-v71.json; then
            echo "No new draws"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keno-history-v71.json keno-status-v71.json
          git commit -m "Столото · KENO v7.1 auto update"
          git fetch origin main --prune
          git rebase origin/main
          git push origin HEAD:main
